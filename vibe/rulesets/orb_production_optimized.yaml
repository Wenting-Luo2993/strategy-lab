# ORB Production Ruleset - Optimized Configuration
# Generated: 2026-05-18
# Based on: Parameter optimization results (2018-2024 backtest)
#
# Key Optimizations:
# - Body Filter = 0.5 (+164% expectancy improvement)
# - Start Time = 09:40 (+54% expectancy improvement)
# - ORB Duration = 5 min (baseline optimal)
# - Take Profit = 0.0 (disabled, research-proven)
#
# Expected Performance (2018-2024):
# - Expectancy: 0.29R per trade
# - Win Rate: 33.9%
# - P&L: $899k on $100k capital (1% risk)
# - Trades: ~240 per year
#
# Status: VALIDATION PENDING
# - Out-of-sample testing on 2025-2026 required
# - Combined Body=0.5 + Start=09:40 not yet tested
# - Tail structure analysis pending

name: orb_production_optimized
description: ORB strategy with optimized parameters (body filter + delayed start)
version: 1.0.0

instruments:
  symbols: [QQQ]
  timeframe: 5m

strategy:
  type: orb
  
  # ORB duration: 5 minutes (baseline optimal)
  # Shorter OR = tighter breakout signal, better R-multiples
  orb_duration_minutes: 5
  
  # ORB start time: 09:40 (delayed start)
  # Wait 10 minutes to avoid early volatility and false breakouts
  # Improvement: +54% expectancy vs 09:30 start
  orb_start_time: "09:40"
  
  # Body filter: 50% minimum (CRITICAL OPTIMIZATION)
  # Requires breakout candle body to be ≥50% of opening range
  # Filters choppy/indecisive breakouts with large wicks
  # Improvement: +164% expectancy vs no filter
  orb_body_pct_filter: 0.5
  
  # Entry cutoff: 15:00 (no impact on expectancy)
  # Can be adjusted for operational convenience
  entry_cutoff_time: "15:00"

exit:
  # Exit type: End-of-Day only
  # Research shows EOD exits contribute +702% of profits
  # Stop exits contribute -602% of profits
  eod: true
  
  # EOD time: 15:55 (no impact on expectancy)
  # 5 minutes before close to ensure fills
  eod_time: "15:55"
  
  # Stop loss: ORB level (opposite side of range)
  stop_loss:
    method: orb_level

position_size:
  # Fixed risk: 1% of capital per trade
  # Can scale to 0.5% (conservative) or 2% (aggressive)
  # Note: Risk % scales P&L linearly without changing expectancy
  method: max_loss_pct
  value: 0.01

trade_filter:
  # Volume threshold: 1.5x average (no impact on expectancy)
  # Can be adjusted for operational filtering
  volume_confirmation: false
  volume_threshold: 1.5

mtf_validation:
  enabled: false
  timeframe: 30m
  condition: trend_aligned

