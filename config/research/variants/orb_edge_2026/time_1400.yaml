name: orb_edge_2026_time_1400
version: "1.0.0"
description: "orb_production flat at 14:00; entries also stop at 14:00 so no position opens after the exit time"

instruments:
  symbols: [QQQ]
  timeframe: 5m

strategy:
  type: orb
  orb_start_time: "09:30"
  orb_duration_minutes: 5
  orb_body_pct_filter: 0.5
  direction_mode: symmetric
  entry_cutoff_time: "14:00"

position_size:
  method: max_loss_pct
  value: 0.01

exit:
  eod: true
  eod_time: "14:00"
  
  take_profit:
    method: orb_range_multiple
    multiplier: 0  # 0 = no take-profit; let winners run to EOD (ORB convexity, see HYP-003/EXP-032)
  
  stop_loss:
    method: orb_level

trade_filter:
  volume_confirmation: false
  volume_threshold: 1.5

mtf_validation:
  enabled: false
  timeframe: 30m
  condition: trend_aligned
