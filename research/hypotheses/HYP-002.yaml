id: HYP-002
title: 'ORB parameter space: shorter windows and larger TP multipliers optimize composite
  performance'
rationale: 'The ORB strategy has three key parameters: ORB window duration (5/10/15
  min), take-profit multiplier (1.5x/2.0x/3.0x), and risk per trade (1%/2%/3%). We
  hypothesize that a shorter opening range (5 min) captures cleaner breakouts, and
  a larger TP multiplier (3x) improves tail ratio and composite score even at lower
  win rates.'
status: proposed
