id: HYP-004
title: Break-even trailing stop after N-R trigger for ORB
rationale: If price reaches a meaningful favorable excursion such as 1R, 2R, or 2.5R,
  moving the stop to break-even plus a few ticks may reduce losing trades while preserving
  ORB convexity because the best multi-R winners may never revisit break-even.
status: proposed
