name: Deploy Live Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/operational-metrics-dashboard/**"
      - ".github/workflows/deploy-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_DASHBOARD_DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DASHBOARD_DATA_SOURCE || 'fixture' }}
      NEXT_PUBLIC_DASHBOARD_FIXTURE: ${{ vars.NEXT_PUBLIC_DASHBOARD_FIXTURE || 'live' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: apps/operational-metrics-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/operational-metrics-dashboard/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Show dashboard build mode
        run: |
          echo "NEXT_PUBLIC_DASHBOARD_DATA_SOURCE=${NEXT_PUBLIC_DASHBOARD_DATA_SOURCE}"
          echo "NEXT_PUBLIC_DASHBOARD_FIXTURE=${NEXT_PUBLIC_DASHBOARD_FIXTURE}"
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL}" ]; then echo "NEXT_PUBLIC_SUPABASE_URL=set"; else echo "NEXT_PUBLIC_SUPABASE_URL=missing"; fi
          if [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]; then echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=set"; else echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=missing"; fi

      - name: Build static dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/operational-metrics-dashboard/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4