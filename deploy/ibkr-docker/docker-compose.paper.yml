# Production paper-trading stack: IB Gateway (gnzsnz/ib-gateway) + trading bot.
# Runbook: deploy/ibkr-docker/README.md
name: strategy-lab

services:
  ib-gateway:
    # Pinned by tag and digest. Bump deliberately: update both, then follow
    # "Upgrading IB Gateway" in the README.
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f@sha256:1e2236804ac949b789197c225a048c0c891c9958f948c87166226e5b647ff581
    container_name: strategy-lab-ib-gateway
    env_file:
      # TWS_USERID only; created by import-ibkr-credentials.sh.
      - path: ./secrets/ib-gateway.env
        required: true
    environment:
      TRADING_MODE: "paper"
      TWS_PASSWORD_FILE: "/run/secrets/tws_password"
      TWOFA_TIMEOUT_ACTION: "exit"
      EXISTING_SESSION_DETECTED_ACTION: "primary"
      TWS_ACCEPT_INCOMING: "accept"
      READ_ONLY_API: "no"
      ALLOW_BLIND_TRADING: "no"
      # Daily restart at 04:00 UTC, matching the former systemd IBC config.
      AUTO_RESTART_TIME: "04:00 AM"
      TWS_COLD_RESTART: "04:00"
      TIME_ZONE: "Etc/UTC"
      TZ: "Etc/UTC"
      TWS_SETTINGS_PATH: "/home/ibgateway/tws_settings"
    secrets:
      - tws_password
    volumes:
      # Must be owned by uid 1000 (image user ibgateway).
      - ./state/tws_settings:/home/ibgateway/tws_settings
    # No host ports. The bot reaches the API over the compose network at
    # ib-gateway:4004 (socat relay to the in-container paper API on 4002).
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4002"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  trading-bot:
    build:
      context: ../..
      dockerfile: vibe/trading_bot/Dockerfile
    image: strategy-lab-trading-bot:local
    container_name: strategy-lab-trading-bot
    depends_on:
      ib-gateway:
        condition: service_healthy
    env_file:
      # Secrets and dashboard/notification settings; see secrets/trading-bot.env.example.
      - path: ./secrets/trading-bot.env
        required: true
    environment:
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      ACTIVE_RULESET: "orb_resting_stop_paper_5sym"
      DATA__PRIMARY_PROVIDER: "interactive_brokers"
      BROKER__BROKER_TYPE: "interactive_brokers"
      BROKER__MODE: "paper"
      BROKER__IB_HOST: "ib-gateway"
      BROKER__IB_PORT: "4004"
      BROKER__IB_CLIENT_ID: "201"
      BROKER__IB_ACCOUNT_ID: "DUQ886014"
      BROKER__IB_MARKET_DATA_TYPE: "1"
      BROKER__IB_CONNECT_TIMEOUT: "30"
      BROKER__HEALTH_CHECK_ENABLED: "true"
      BROKER__HEALTH_CHECK_SYMBOL: "QQQ"
      DATA__POLL_INTERVAL_WITH_POSITION: "60"
      DATA__POLL_INTERVAL_NO_POSITION: "60"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # The bot resolves ./data and ./logs relative to WORKDIR /app.
      # Both must be owned by uid 1000 (image user trading).
      - ./data/trading-bot:/app/data
      - ./logs/trading-bot:/app/logs
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

secrets:
  tws_password:
    file: ./secrets/tws_password
